<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Networking & Cloud Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="main-nav">
      <a href="index.html" class="nav-brand">NetCloud Portfolio</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="contact.html" class="nav-link active">Contact Me</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <section class="contact-section">
      <h1>Contact / Hire Me</h1>
      <p class="section-intro">
        Interested in networking or cloud work? Send a message and I will get back to you.
      </p>

      <form id="contactForm" class="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required maxlength="100" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="100" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required maxlength="150">
        </div>

        <div class="form-group form-group-full">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div id="formResponse" class="form-response" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Networking &amp; Cloud Engineering Portfolio</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
